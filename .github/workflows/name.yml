#this is the name of workflow
name: hello dosto
on:
  push:
    branches: [main]
# this is the job inside the workflow
jobs:
  # it is the name of job
  greets:  
    # this is github runner, each job runs on runner
    runs-on: ubuntu-latest
    steps:
      - name: say hello to user
        run: echo "hello dosto"

      - name: say hello to username
        run: echo " hello $USER"

details:
  runs-on: ubuntu-latest
  steps:
    - name: show the version of docker and python 
      run: docker --version && python --version
